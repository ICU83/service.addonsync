name: Validate AddonSync

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python tests/validate_repo.py

      - name: Build Kodi ZIP
        run: python scripts/build_zip.py

      - name: Show package contents
        run: unzip -l dist/service.addonsync-*.zip
